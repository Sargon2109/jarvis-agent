# Jarvis is a repo-rooted app, not a library: its data/ and scratch/ folders
# live beside the package. Install editable (pip install -e .) so those paths
# keep working; a site-packages install would orphan them.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "0.5.0"
description = "A personal chief-of-staff agent: capture, remember, delegate."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
# Pinned exactly: claude-agent-sdk is the one dependency whose upgrades can
# change behavior under Jarvis; moving the pin is a deliberate, tested act.
dependencies = [
    "claude-agent-sdk==0.2.139",
    "python-dotenv==1.2.3",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis", "jarvis.agents"]

[tool.setuptools.package-data]
jarvis = ["web/*.html"]

[tool.mypy]
python_version = "3.10"
# Pragmatic, not strict: catch real type errors without demanding annotations
# the codebase doesn't need. The SDK ships no stubs.
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
